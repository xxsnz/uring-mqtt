[package]
name = "uring-mqtt"
version = "0.1.0"
edition = "2021"
description = "High-performance MQTT broker using Monoio io_uring runtime"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xxsnz/uring-mqtt"
readme = "README.md"
keywords = ["mqtt", "io-uring", "iot", "telemetry", "monoio"]
categories = ["network-programming", "asynchronous"]
rust-version = "1.89"

[dependencies]
# Monoio runtime with io_uring support
monoio = { version = "0.2", features = ["iouring", "legacy", "sync", "macros", "bytes"] }
monoio-codec = "0.3"
local-sync = "0.1.1"

# MQTT protocol codec
rmqtt-codec = "0.2"

# Required for codec trait implementations
tokio-util = { version = "0.7", features = ["codec"] }

# Buffer and byte handling
bytes = "1.5"

# Synchronization primitives
parking_lot = "0.12"

# Logging
tracing = "0.1"

# Error handling
thiserror = "2.0"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[features]
default = []

[[example]]
name = "simple_broker"
path = "examples/simple_broker.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow certain pedantic lints that are too noisy for this codebase
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
return_self_not_must_use = "allow"
needless_pass_by_value = "allow"   # EventCallback needs ownership
cast_precision_loss = "allow"      # Acceptable for memory stats
inline_always = "allow"            # Hot path optimization
doc_markdown = "allow"             # Too noisy for technical terms
